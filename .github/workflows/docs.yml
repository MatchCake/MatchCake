name: Docs

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]


jobs:
  Check-Docs:
    name: Check docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.2"
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv venv .venv
        uv sync --locked --dev --group docs --extra cpu

    - name: Fail on unresolved cross-references
      run: |
        set -eo pipefail
        uv run sphinx-build -b html sphinx/source sphinx/build/check 2>&1 | tee sphinx-build.log
        if grep -q "myst.xref_missing" sphinx-build.log; then
          echo "::error::Unresolved cross-references found. A relative link that does not point to a document in the docs renders as a dead same-page anchor."
          grep "myst.xref_missing" sphinx-build.log
          exit 1
        fi

  Link-Check:
    name: Check docs links
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.2"
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv venv .venv
        uv sync --locked --dev --group docs --extra cpu

    - name: Run the linkcheck builder
      run: |
        uv run sphinx-build -b linkcheck sphinx/source sphinx/build/linkcheck

    - name: Resolve links into this repository
      run: |
        uv run python .github/scripts/resolve_repository_links.py

  Build-Docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs: Check-Docs
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.2"
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv venv .venv
        uv sync --locked --dev --group docs --extra cpu

    - name: Fetch all branches for multiversion build
      run: |
        git fetch --all

    - name: Build the sphinx docs
      run: |
        uv run make -C sphinx clean
        uv run python sphinx/clean_html_files.py
        uv run sphinx-multiversion sphinx/source sphinx/build/html
        printf '<html><head><meta http-equiv="refresh" content="0; url=main/index.html"/></head><body></body></html>' > sphinx/build/html/index.html
        touch sphinx/build/html/.nojekyll

    - name: Checkout gh-pages branch
      run: |
        git checkout -b gh-pages
        git init

    - name: Copy build files to docs folder
      run: |
        cp -a sphinx/build/html/. docs/
        uv run python sphinx/make_html_files_list.py
        rm -rf sphinx/build

    - name: Commit to gh-pages branch
      run: |
        git add -f docs
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "Update docs"

    - name: Push to gh-pages branch
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        branch: gh-pages
        force: true
        directory: docs
